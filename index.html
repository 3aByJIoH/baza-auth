<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Вход выполнен</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f4ef;
         font: 18px/1.45 system-ui, sans-serif; color: #1f2a26; text-align: center; padding: 16px; }
  a { display: inline-block; margin-top: 16px; padding: 14px 24px; border-radius: 14px;
      background: #2f5d50; color: #fff; text-decoration: none; font-weight: 700; }
  small { display: block; max-width: 420px; margin: 20px auto 0; color: #5a6862; font-size: 15px; }
</style>
</head>
<body>
<main>
  <p>Вход через Яндекс выполнен.<br>Возвращаемся в приложение…</p>
  <a id="back" href="#">Вернуться в приложение</a>
  <small id="help" hidden>Если приложение не открылось: настройки телефона → Приложения → «База клиентов» →
    «Открывать по умолчанию» → включите «Открывать поддерживаемые ссылки».</small>
</main>
<script>
  // Страница-посредник для «Базы клиентов».
  // Яндекс присылает ключ в адресе после #. Ключ никуда не отправляется:
  // на телефоне передаётся в приложение, в браузере ПК — окну, которое открыло вход.
  var hash = location.hash;
  var state = new URLSearchParams(hash.slice(1)).get('state') || '';
  var back = document.getElementById('back');

  // Ключ получают только наши адреса (ПК-версия и разработка), чужой сайт его не увидит.
  var OUR = ['https://3abyjioh.github.io', 'http://localhost:5180'];
  if (window.opener) {
    OUR.forEach(function (origin) { window.opener.postMessage(hash, origin); });
    window.close();
  } else if (state.indexOf('v2.') === 0) {
    // Версия 1.5 и новее. Обычно Android сразу открывает приложение по этому адресу
    // (проверенная ссылка), и страница даже не показывается. Если показалась — передаём
    // ключ адресным вызовом: его получит только приложение с пакетом ru.klientbaza.app.
    var url = 'intent://3abyjioh.github.io/baza-auth/?' + hash.slice(1) +
      '#Intent;scheme=https;package=ru.klientbaza.app;end';
    back.href = url;
    document.getElementById('help').hidden = false;
    location.replace(url);
  } else {
    // Старые версии приложения (до 1.5) ждут ключ по своей ссылке.
    var appUrl = 'ru.klientbaza.app://auth' + hash;
    back.href = appUrl;
    location.replace(appUrl);
  }
  // ключ не должен оставаться в истории браузера
  history.replaceState(null, '', location.pathname);
</script>
</body>
</html>
